apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel-test
  template:
    metadata:
      labels:
        app: laravel-test
    spec:
      containers:
        - name: laravel
          image: pyoawndi12/student-devops-laravel-semple:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: laravel-config

            - secretRef:
                name: laravel-secret
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  type: LoadBalancer
  selector:
    app: laravel-test
  ports:
    - port: 80
      targetPort: 80